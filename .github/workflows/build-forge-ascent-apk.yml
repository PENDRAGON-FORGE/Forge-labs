name: Build FORGE ASCENT APK

on:
  pull_request:
    branches: ["forge-ascent-v201-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore verified FORGE ASCENT v2 web bundle
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat > payload-v2/SHA1SUMS <<'EOF'
          0df492cb643bb8ace8c5e9d60de05df9da699bbc  payload-v2/p01.b64
          a2e48fa8d4b08aa0d02ee7f41f96d64e34e18e17  payload-v2/q02.b64
          450851ee4d9f8954d40d2326587f8150147af6ef  payload-v2/q03.b64
          a24a24c0bc7f99bbe22789993603ab344d3e2dce  payload-v2/q04.b64
          cf1444bad7cb2176e0feff2b43b748849e498792  payload-v2/t05_1.b64
          7b28bc2a34eb8bb905771e2a8f19626c4ba29813  payload-v2/t05_2.b64
          bdaa73f3d5dd4f7bb3d4dbcb67b3c3cfd1548e3c  payload-v2/t05_3.b64
          17b2b3cd82a91502f0782637434259c0856202f6  payload-v2/t05_4.b64
          6a21170f15bb66c147cb8efaebfea268dc247cbb  payload-v2/s06a.b64
          30ca16520af39e08ea4e144c88f085af59860f90  payload-v2/s06b.b64
          4c53af0b63c1b25a45b13328eea08dcd09a58a0d  payload-v2/s07a.b64
          d355322c0fcb82badb468fda37038898215d3bb0  payload-v2/s07b.b64
          EOF
          sha1sum -c payload-v2/SHA1SUMS
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/t05_1.b64 payload-v2/t05_2.b64 payload-v2/t05_3.b64 payload-v2/t05_4.b64 payload-v2/s06a.b64 payload-v2/s06b.b64 payload-v2/s07a.b64 payload-v2/s07b.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          unzip -t bundle-v2.zip
          mkdir -p www
          unzip -q bundle-v2.zip -d www
          test -f www/index.html
          test -f www/app.js

      - name: Apply audited runtime fixes v2.0.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          ds = Path("www/data-store.js")
          s = ds.read_text(encoding="utf-8")
          s = s.replace('    schemaVersion: SCHEMA_VERSION,\n    profile: {','    schemaVersion: SCHEMA_VERSION,\n    ui: { onboardingComplete: false },\n    profile: {',1)
          s = s.replace('    } else {\n      Object.assign(d.profile, source.profile||{});','    } else {\n      Object.assign(d.ui, source.ui||{});\n      Object.assign(d.profile, source.profile||{});',1)
          s = s.replace('      schemaVersion:SCHEMA_VERSION,\n      profile:{...d.profile,...(s.profile||{})},','      schemaVersion:SCHEMA_VERSION,\n      ui:{...d.ui,...(s.ui||{})},\n      profile:{...d.profile,...(s.profile||{})},',1)
          s = s.replace('    out.profile.age = Math.floor(number(out.profile.age,13,100,33));','    out.ui.onboardingComplete = Boolean(out.ui.onboardingComplete);\n    out.profile.age = Math.floor(number(out.profile.age,13,100,33));',1)
          s = s.replace('      decision: String(s.decision || "maintain")\n    };','      decision: String(s.decision || "maintain"),\n      substitutions:Array.isArray(s.substitutions)?s.substitutions:[],\n      exerciseIds:Array.isArray(s.exerciseIds)?s.exerciseIds.map(String):[],\n      guided:Boolean(s.guided)\n    };',1)
          ds.write_text(s, encoding="utf-8")

          app = Path("www/app.js")
          a = app.read_text(encoding="utf-8")
          a = a.replace('$("guidedImage").src=patternAsset(id);','$("guidedImage").src=`./assets/exercises/${id}.svg`;')
          a = a.replace('function guidedRender(){','function exerciseLinesForSession(s){return (s?.items||[]).filter(x=>!x.startsWith("Semana de descarga")&&!x.startsWith("Circuito ·"))}\nfunction guidedRender(){',1)
          a = a.replace('const id=s.exerciseIds[guidedState.index],ex=window.FORGE_EXERCISES?.byId(id),line=s.items.find(x=>ex&&x.includes(ex.name))||s.items[guidedState.index]||ex?.name||id;','const id=s.exerciseIds[guidedState.index],ex=window.FORGE_EXERCISES?.byId(id),line=exerciseLinesForSession(s)[guidedState.index]||ex?.name||id;',1)
          a = a.replace('function completeCurrentExercise(){const s=guidedState.session,id=s.exerciseIds[guidedState.index],ex=window.FORGE_EXERCISES?.byId(id),line=s.items.find(x=>ex&&x.includes(ex.name))||"",count=seriesCount(line);','function completeCurrentExercise(){const s=guidedState.session,id=s.exerciseIds[guidedState.index],ex=window.FORGE_EXERCISES?.byId(id),line=exerciseLinesForSession(s)[guidedState.index]||"",count=seriesCount(line);',1)
          a = a.replace('session.items.map((x,i)=>{const ex=session.exerciseIds?.[i]?EXLIB.byId(session.exerciseIds[i]):null','exerciseLinesForSession(session).map((x,i)=>{const ex=session.exerciseIds?.[i]?EXLIB.byId(session.exerciseIds[i]):null',1)
          a = a.replace('const omitted=checks.map((c,i)=>c.checked?null:session.items[i]).filter(Boolean),completion=done/checks.length;','const planned=exerciseLinesForSession(session),omitted=checks.map((c,i)=>c.checked?null:planned[i]).filter(Boolean),completion=done/checks.length;',1)
          a = a.replace('planned:session.items,completed:checks.map((c,i)=>c.checked?session.items[i]:null).filter(Boolean),omitted,','planned,completed:checks.map((c,i)=>c.checked?planned[i]:null).filter(Boolean),omitted,',1)
          a = a.replace('let mins=(eh*60+em)-(sh*60+sm);if(mins<=0)mins+=1440;return mins;','let mins=(eh*60+em)-(sh*60+sm);if(mins===0)return 0;if(mins<0)mins+=1440;return mins;',1)
          a = a.replace('if(!start||!end||!Number.isFinite(duration)||duration<=0){','if(!start||!end||!Number.isFinite(duration)||duration<=0||duration>240){',1)
          a = a.replace('!Number.isFinite(duration)||duration<1){','!Number.isFinite(duration)||duration<1||duration>180){',1)
          a = a.replace('a.download="forge-ascent-v1-3-backup.json";','a.download="forge-ascent-v2-backup.json";',1)
          a += r'''

          // FORGE ASCENT v2.0.4 — audited late bindings for post-script UI.
          window.setView = function(target){
            const targetView=document.getElementById(target);
            if(!targetView || !targetView.classList.contains('view')) return false;
            document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v===targetView));
            const directNav=document.querySelector(`nav button[data-view="${target}"]`);
            document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',directNav ? b===directNav : b.dataset.view==='operator'));
            try { refresh(); } catch(e) { console.error('FORGE ASCENT view refresh failed',e); }
            window.scrollTo({top:0,left:0,behavior:'auto'});
            return true;
          };

          (function bindForgeAscentPostScriptUi(){
            function bindButton(id,fn){
              const el=document.getElementById(id);
              if(!el) return;
              el.type='button';
              el.onclick=fn;
            }
            function bind(){
              const currentStep=()=>Number(document.querySelector('.onboarding-step:not(.hidden)')?.dataset.step||0);
              document.querySelectorAll('.onboarding-next').forEach(btn=>{btn.type='button';btn.onclick=()=>showOnboardingStep(currentStep()+1);});
              document.querySelectorAll('.onboarding-prev').forEach(btn=>{btn.type='button';btn.onclick=()=>showOnboardingStep(currentStep()-1);});
              bindButton('onboardingFinish',finishOnboarding);
              document.querySelectorAll('[data-open-view]').forEach(btn=>{btn.type='button';btn.onclick=()=>window.setView(btn.dataset.openView);});
              bindButton('closeGuided',guidedClose);
              bindButton('guidedPrev',()=>{guidedState.index--;guidedRender();});
              bindButton('guidedNext',()=>{guidedState.index++;guidedRender();});
              bindButton('guidedComplete',completeCurrentExercise);
              bindButton('restStart',startRest);
              bindButton('restSkip',()=>{guidedState.restSeconds=0;updateRest();if(guidedState.restTimer){clearInterval(guidedState.restTimer);guidedState.restTimer=null;}});
              bindButton('restAdd',()=>{guidedState.restSeconds+=15;updateRest();});
              bindButton('completeClose',()=>{document.getElementById('missionComplete').classList.add('hidden');renderTraining();});
              bindButton('closeoutBack',()=>{document.getElementById('missionCloseout').classList.add('hidden');document.getElementById('guidedSession').classList.remove('hidden');guidedRender();});
              bindButton('closeoutSave',saveGuidedMission);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind,{once:true});
            else bind();
          })();
          '''
          app.write_text(a, encoding="utf-8")

          html = Path("www/index.html").read_text(encoding="utf-8")
          script_pos = html.find('<script src="./data-store.js"></script>')
          if script_pos < 0: raise SystemExit('Script anchor missing')
          post_html = html[script_pos:]
          required_post_ids = {'closeGuided','guidedPrev','guidedNext','guidedComplete','restStart','restSkip','restAdd','completeClose','closeoutBack','closeoutSave','onboardingFinish'}
          post_ids = set(re.findall(r'id="([^"]+)"', post_html))
          if required_post_ids-post_ids: raise SystemExit(f'Missing post-script controls: {sorted(required_post_ids-post_ids)}')

          targets = re.findall(r'data-open-view="([^"]+)"', html)
          view_ids = set(re.findall(r'<section[^>]+id="([^"]+)"[^>]+class="[^"]*\bview\b', html))
          if set(targets) != {'profile','review','body','tests','library','data'}: raise SystemExit(f'Unexpected Operator targets: {targets}')
          if set(targets)-view_ids: raise SystemExit(f'Missing Operator view targets: {sorted(set(targets)-view_ids)}')

          lib = json.loads(Path('www/exercise-library.json').read_text(encoding='utf-8'))
          exercise_ids = {x['id'] for x in lib['exercises']}
          asset_ids = {p.stem for p in Path('www/assets/exercises').glob('*.svg')}
          if exercise_ids != asset_ids: raise SystemExit(f'Exercise visual mismatch missing={sorted(exercise_ids-asset_ids)} extra={sorted(asset_ids-exercise_ids)}')
          if len(exercise_ids) != 18: raise SystemExit(f'Expected 18 exercise visuals, got {len(exercise_ids)}')
          PY
          node --check www/app.js
          node --check www/data-store.js
          grep -q "exerciseLinesForSession" www/app.js
          grep -q "duration>240" www/app.js
          grep -q "duration>180" www/app.js
          grep -q "bindForgeAscentPostScriptUi" www/app.js
          grep -q "substitutions:Array.isArray" www/data-store.js

      - name: Audit all 120 planned sessions
        run: |
          node <<'JS'
          global.window=global;
          global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');
          for(const f of ['data-store.js','training-data.js','adaptive-engine.js']) vm.runInThisContext(fs.readFileSync('www/'+f,'utf8'),{filename:f});
          const lib=JSON.parse(fs.readFileSync('www/exercise-library.json','utf8')),all=()=>lib.exercises;
          window.FORGE_EXERCISES={
            byId:id=>all().find(e=>e.id===id)||null,
            byPattern:p=>all().filter(e=>e.pattern===p),
            riskAllowed:(e,c={})=>{const p=+c.lumbarPain||0;if(p>=5&&e.lumbarStress>1)return false;if(p>=3&&e.lumbarStress>2)return false;return true},
            equipmentMatches:(e,user=[])=>{if(!e.equipment?.length)return true;const q=user.map(x=>String(x).toLowerCase());return e.equipment.every(r=>['silla','superficie_elevada','toalla','apoyo_estable'].includes(r)||(r==='caminadora'&&q.some(x=>x.includes('caminadora')))||(r==='banda'&&q.some(x=>x.includes('banda')))||(r==='mancuerna'&&q.some(x=>x.includes('mancuerna'))))},
            select(pattern,c={}){return this.byPattern(pattern).filter(e=>this.equipmentMatches(e,c.equipment||[])).filter(e=>this.riskAllowed(e,c))[0]||null}
          };
          const state=JSON.parse(JSON.stringify(FORGE_STORE.defaults));
          let tested=0;
          for(let w=1;w<=24;w++) for(let d=0;d<5;d++){
            const s=FORGE_ADAPTIVE.buildSession(d,w,state,FORGE_TRAINING);tested++;
            const lines=s.items.filter(x=>!x.startsWith('Semana de descarga')&&!x.startsWith('Circuito ·'));
            if(!s.exerciseIds.length) throw Error(`empty session w${w}d${d+1}`);
            if(lines.length!==s.exerciseIds.length) throw Error(`alignment w${w}d${d+1}: ${lines.length}/${s.exerciseIds.length}`);
            if(s.exerciseIds.some(id=>!FORGE_TRAINING.exerciseTemplates[id])) throw Error(`unknown exercise w${w}d${d+1}`);
          }
          if(tested!==120) throw Error(`expected 120 sessions, got ${tested}`);
          console.log(`120/120 sessions valid and exercise-line aligned`);
          JS

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Harden Gradle wrapper network timeout
        run: |
          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=60000' >> android/gradle/wrapper/gradle-wrapper.properties

      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 24/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.4"/' android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0.4-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0.4_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0.4-native.apk
          if-no-files-found: error
          retention-days: 30
