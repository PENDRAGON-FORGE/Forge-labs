name: Build FORGE ASCENT APK

on:
  pull_request:
    branches: ["forge-ascent-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore FORGE ASCENT v2 web bundle
        run: |
          rm -rf www bundle-v2.zip
          base64 --decode www-v2.zip > bundle-v2.zip
          unzip -t bundle-v2.zip
          mkdir -p www
          unzip -q bundle-v2.zip -d www
          test -f www/index.html
          test -f www/app.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 20/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0"/' android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0-native.apk
          if-no-files-found: error
          retention-days: 30
