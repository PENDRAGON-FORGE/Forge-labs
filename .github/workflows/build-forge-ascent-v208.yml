name: Build FORGE ASCENT v2.0.8 AUDIT

on:
  pull_request:
    branches: ["forge-ascent-v206-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-v208.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore verified web bundle
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/t05_1.b64 payload-v2/t05_2.b64 payload-v2/t05_3.b64 payload-v2/t05_4.b64 payload-v2/s06a.b64 payload-v2/s06b.b64 payload-v2/s07a.b64 payload-v2/s07b.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          unzip -t bundle-v2.zip
          mkdir -p www && unzip -q bundle-v2.zip -d www
      - name: Apply v2.0.8 audit patch
        run: python3 audit_v208.py
      - name: Syntax audit
        run: |
          node --check www/app.js
          node --check www/data-store.js
      - name: Date and backup safety audit
        run: |
          node <<'JS'
          global.window=global;global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');vm.runInThisContext(fs.readFileSync('www/data-store.js','utf8'));
          const good=FORGE_STORE.importPayload({sessionLogs:[{date:'2026-08-29',week:2,day:3,duration:45}],reviews:[{date:'2026-08-29',energy:6,pain:1,sleep:8}]});
          if(good.sessionLogs.length!==1||good.reviews.length!==1||!good.progression.weekProgress['2']?.includes(2)) throw Error('valid date/progress reconstruction failed');
          const bad=FORGE_STORE.importPayload({sessionLogs:[{date:'<img src=x onerror=alert(1)>',week:1,day:1,duration:45},{date:'2026-02-31',week:1,day:2,duration:45}],reviews:[{date:'not-a-date'}],tests:[{date:'2026-13-01'}],body:{measurements:[{date:'2026-00-10'}]}});
          if(bad.sessionLogs.length||bad.reviews.length||bad.tests.length||bad.body.measurements.length) throw Error('invalid dates survived normalization');
          console.log('date/backup safety PASS');
          JS
      - name: Guided completion integrity static audit
        run: |
          grep -q 'firstMissing=s.exerciseIds.findIndex' www/app.js
          grep -q 'function escapeHTML' www/app.js
          grep -q 'Objetivo: ${objective}' www/app.js
      - name: Audit all 120 planned sessions
        run: |
          node <<'JS'
          global.window=global;global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');for(const f of ['data-store.js','training-data.js','adaptive-engine.js'])vm.runInThisContext(fs.readFileSync('www/'+f,'utf8'),{filename:f});
          const lib=JSON.parse(fs.readFileSync('www/exercise-library.json','utf8')),all=()=>lib.exercises;
          window.FORGE_EXERCISES={byId:id=>all().find(e=>e.id===id)||null,byPattern:p=>all().filter(e=>e.pattern===p),riskAllowed:(e,c={})=>{const p=+c.lumbarPain||0;if(p>=5&&e.lumbarStress>1)return false;if(p>=3&&e.lumbarStress>2)return false;return true},equipmentMatches:(e,user=[])=>{if(!e.equipment?.length)return true;const q=user.map(x=>String(x).toLowerCase());return e.equipment.every(r=>['silla','superficie_elevada','toalla','apoyo_estable'].includes(r)||(r==='caminadora'&&q.some(x=>x.includes('caminadora')))||(r==='banda'&&q.some(x=>x.includes('banda')))||(r==='mancuerna'&&q.some(x=>x.includes('mancuerna'))))},select(pattern,c={}){return this.byPattern(pattern).filter(e=>this.equipmentMatches(e,c.equipment||[])).filter(e=>this.riskAllowed(e,c))[0]||null}};
          const state=JSON.parse(JSON.stringify(FORGE_STORE.defaults));let n=0;for(let w=1;w<=24;w++)for(let d=0;d<5;d++){const s=FORGE_ADAPTIVE.buildSession(d,w,state,FORGE_TRAINING),lines=s.items.filter(x=>!x.startsWith('Semana de descarga')&&!x.startsWith('Circuito ·'));n++;if(lines.length!==s.exerciseIds.length)throw Error(`mapping fail ${w}/${d}`)}if(n!==120)throw Error('count fail');console.log('120/120 sessions PASS');
          JS
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Harden Gradle wrapper timeout
        run: |
          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=60000' >> android/gradle/wrapper/gradle-wrapper.properties
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 28/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.8"/' android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android
      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify patched Android assets
        run: |
          grep -q 'firstMissing=s.exerciseIds.findIndex' android/app/src/main/assets/public/app.js
          grep -q 'function validDate' android/app/src/main/assets/public/data-store.js
          grep -q 'Unrecognized legacy backup' android/app/src/main/assets/public/data-store.js
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0.8-native.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0.8_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0.8-native.apk
          if-no-files-found: error
          retention-days: 30
