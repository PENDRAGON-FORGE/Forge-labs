name: Build FORGE ASCENT APK

on:
  pull_request:
    branches: ["forge-ascent-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore verified FORGE ASCENT v2 web bundle
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat > payload-v2/SHA1SUMS <<'EOF'
          0df492cb643bb8ace8c5e9d60de05df9da699bbc  payload-v2/p01.b64
          a2e48fa8d4b08aa0d02ee7f41f96d64e34e18e17  payload-v2/q02.b64
          450851ee4d9f8954d40d2326587f8150147af6ef  payload-v2/q03.b64
          a24a24c0bc7f99bbe22789993603ab344d3e2dce  payload-v2/q04.b64
          2d444683b39aea1eac8224b920b6bac280dd4f75  payload-v2/q05.b64
          7b9b246432ea84a80b1162dd5c2e6523127e4948  payload-v2/q06.b64
          82beab2bce0bb4cfc80ce61711e643e43427a1da  payload-v2/q07.b64
          EOF
          sha1sum -c payload-v2/SHA1SUMS
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/q05.b64 payload-v2/q06.b64 payload-v2/q07.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          unzip -t bundle-v2.zip
          mkdir -p www
          unzip -q bundle-v2.zip -d www
          test -f www/index.html
          test -f www/app.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 20/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0"/' android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0-native.apk
          if-no-files-found: error
          retention-days: 30
