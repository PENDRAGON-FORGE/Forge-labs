name: Build FORGE ASCENT v2.0.6 FIXED

on:
  pull_request:
    branches: ["forge-ascent-v206-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-v206-fixed.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore verified web bundle
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/t05_1.b64 payload-v2/t05_2.b64 payload-v2/t05_3.b64 payload-v2/t05_4.b64 payload-v2/s06a.b64 payload-v2/s06b.b64 payload-v2/s07a.b64 payload-v2/s07b.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          unzip -t bundle-v2.zip
          mkdir -p www
          unzip -q bundle-v2.zip -d www

      - name: Apply runtime audit patch
        run: python3 audit_v206.py

      - name: Syntax audit
        run: |
          node --check www/app.js
          node --check www/data-store.js

      - name: State roundtrip audit
        run: |
          node <<'JS'
          global.window=global;let mem={};global.localStorage={getItem:k=>mem[k]||null,setItem:(k,v)=>mem[k]=v};
          const fs=require('fs'),vm=require('vm');vm.runInThisContext(fs.readFileSync('www/data-store.js','utf8'));
          let s=JSON.parse(JSON.stringify(FORGE_STORE.defaults));
          s.ui.onboardingComplete=true;s.profile.objective='Ganar fuerza';
          s.reviews=[{date:'2026-08-29',weight:null,waist:null,pushups:null,plank:null,energy:6,pain:0,sleep:8,notes:'Check-in inicial'}];
          s.sessionLogs=[{date:'2026-08-29',week:1,day:1,duration:60,rpe:6,painBefore:0,painAfter:0,energyBefore:5,energyAfter:6,completion:1,exerciseIds:['push_wall'],substitutions:[],guided:true}];
          FORGE_STORE.save(s);const n=FORGE_STORE.load();
          if(!n.ui.onboardingComplete||n.profile.objective!=='Ganar fuerza'||n.reviews[0].weight!==null||n.sessionLogs[0].exerciseIds[0]!=='push_wall'||!n.sessionLogs[0].guided||n.progression.sessions<1)throw Error('state roundtrip failed');
          console.log('state roundtrip PASS');
          JS

      - name: Audit all 120 planned sessions
        run: |
          node <<'JS'
          global.window=global;global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');for(const f of ['data-store.js','training-data.js','adaptive-engine.js'])vm.runInThisContext(fs.readFileSync('www/'+f,'utf8'),{filename:f});
          const lib=JSON.parse(fs.readFileSync('www/exercise-library.json','utf8')),all=()=>lib.exercises;
          window.FORGE_EXERCISES={byId:id=>all().find(e=>e.id===id)||null,byPattern:p=>all().filter(e=>e.pattern===p),riskAllowed:(e,c={})=>{const p=+c.lumbarPain||0;if(p>=5&&e.lumbarStress>1)return false;if(p>=3&&e.lumbarStress>2)return false;return true},equipmentMatches:(e,user=[])=>{if(!e.equipment?.length)return true;const q=user.map(x=>String(x).toLowerCase());return e.equipment.every(r=>['silla','superficie_elevada','toalla','apoyo_estable'].includes(r)||(r==='caminadora'&&q.some(x=>x.includes('caminadora')))||(r==='banda'&&q.some(x=>x.includes('banda')))||(r==='mancuerna'&&q.some(x=>x.includes('mancuerna'))))},select(pattern,c={}){return this.byPattern(pattern).filter(e=>this.equipmentMatches(e,c.equipment||[])).filter(e=>this.riskAllowed(e,c))[0]||null}};
          const state=JSON.parse(JSON.stringify(FORGE_STORE.defaults));let tested=0;
          for(let w=1;w<=24;w++)for(let d=0;d<5;d++){const s=FORGE_ADAPTIVE.buildSession(d,w,state,FORGE_TRAINING),lines=s.items.filter(x=>!x.startsWith('Semana de descarga')&&!x.startsWith('Circuito ·'));tested++;if(!s.exerciseIds.length||lines.length!==s.exerciseIds.length||s.exerciseIds.some(id=>!FORGE_TRAINING.exerciseTemplates[id]))throw Error(`session audit failed w${w}d${d+1}`)}
          if(tested!==120)throw Error('session count mismatch');console.log('120/120 sessions PASS');
          JS

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Harden Gradle wrapper timeout
        run: |
          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=60000' >> android/gradle/wrapper/gradle-wrapper.properties

      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 26/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.6"/' android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify patched assets copied into Android
        run: |
          grep -q "localDateISO" android/app/src/main/assets/public/app.js
          grep -q "window.setView" android/app/src/main/assets/public/app.js
          grep -q "objective" android/app/src/main/assets/public/data-store.js

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0.6-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0.6_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0.6-native.apk
          if-no-files-found: error
          retention-days: 30
