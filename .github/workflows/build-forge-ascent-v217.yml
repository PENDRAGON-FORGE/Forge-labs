name: Build FORGE ASCENT v2.0.17 BACKUP INTEGRITY
on:
  pull_request:
    branches: ["forge-ascent-v206-ci-base"]
    paths: ["apps/forge-ascent/**", ".github/workflows/build-forge-ascent-v217.yml"]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent
    env:
      FA_KEYSTORE_B64: ${{ secrets.FA_KEYSTORE_B64 }}
      FA_KEYSTORE_PASSWORD: ${{ secrets.FA_KEYSTORE_PASSWORD }}
      FA_KEY_ALIAS: ${{ secrets.FA_KEY_ALIAS }}
      FA_KEY_PASSWORD: ${{ secrets.FA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Restore and patch
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/t05_1.b64 payload-v2/t05_2.b64 payload-v2/t05_3.b64 payload-v2/t05_4.b64 payload-v2/s06a.b64 payload-v2/s06b.b64 payload-v2/s07a.b64 payload-v2/s07b.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          mkdir -p www && unzip -q bundle-v2.zip -d www
          python3 audit_v217.py
          node --check www/app.js
          grep -q 'payload.integrity={product:"FORGE ASCENT",schema:2' www/app.js
          grep -q 'backup product mismatch' www/app.js
      - name: Android platform
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          MAIN=android/app/src/main/java/com/pendragonforge/forgeascent/v2/MainActivity.java
          mkdir -p "$(dirname "$MAIN")"
          cp MainActivity.v217.java.txt "$MAIN"
          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=60000' >> android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/versionCode 1/versionCode 37/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.17"/' android/app/build.gradle
      - name: Optional persistent signing
        run: |
          if [ -n "$FA_KEYSTORE_B64" ] && [ -n "$FA_KEYSTORE_PASSWORD" ] && [ -n "$FA_KEY_ALIAS" ] && [ -n "$FA_KEY_PASSWORD" ]; then
            echo "$FA_KEYSTORE_B64" | base64 --decode > android/app/forge-ascent-release.jks
            python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle');s=p.read_text()
          s=s.replace('android {','''android {\n    signingConfigs {\n        release {\n            storeFile file("forge-ascent-release.jks")\n            storePassword System.getenv("FA_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("FA_KEY_ALIAS")\n            keyPassword System.getenv("FA_KEY_PASSWORD")\n        }\n    }''',1)
          s=s.replace('buildTypes {\n        release {','buildTypes {\n        release {\n            signingConfig signingConfigs.release',1);p.write_text(s)
          PY
            echo 'FORGE_ASCENT_SIGNED=1' >> "$GITHUB_ENV"
          else
            echo 'FORGE_ASCENT_SIGNED=0' >> "$GITHUB_ENV"
          fi
      - name: Build and verify exact APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew
          if [ "$FORGE_ASCENT_SIGNED" = "1" ]; then ./gradlew assembleRelease --stacktrace; APK=app/build/outputs/apk/release/app-release.apk; else ./gradlew assembleDebug --stacktrace; APK=app/build/outputs/apk/debug/app-debug.apk; fi
          cd ..
          test -f "android/$APK"
          unzip -p "android/$APK" assets/public/app.js > /tmp/apk-app.js
          grep -q 'payload.integrity={product:"FORGE ASCENT",schema:2' /tmp/apk-app.js
          grep -q 'BACKUP_MAX_BYTES=5\*1024\*1024' /tmp/apk-app.js
          cp "android/$APK" FORGE_ASCENT_v2.0.17-native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0.17_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0.17-native.apk
          retention-days: 30
