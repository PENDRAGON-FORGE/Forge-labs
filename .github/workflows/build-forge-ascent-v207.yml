name: Build FORGE ASCENT v2.0.7 AUDIT

on:
  pull_request:
    branches: ["forge-ascent-v206-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-v207.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore verified web bundle
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/t05_1.b64 payload-v2/t05_2.b64 payload-v2/t05_3.b64 payload-v2/t05_4.b64 payload-v2/s06a.b64 payload-v2/s06b.b64 payload-v2/s07a.b64 payload-v2/s07b.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          unzip -t bundle-v2.zip
          mkdir -p www && unzip -q bundle-v2.zip -d www

      - name: Apply v2.0.7 audit patch
        run: python3 audit_v207.py

      - name: Syntax audit
        run: |
          node --check www/app.js
          node --check www/data-store.js

      - name: Backup export-import and rejection audit
        run: |
          node <<'JS'
          global.window=global;let mem={};global.localStorage={getItem:k=>mem[k]||null,setItem:(k,v)=>mem[k]=v};
          const fs=require('fs'),vm=require('vm');vm.runInThisContext(fs.readFileSync('www/data-store.js','utf8'));
          let s=JSON.parse(JSON.stringify(FORGE_STORE.defaults));
          s.ui.onboardingComplete=true;s.profile.name='QA Operator';s.profile.objective='Ganar fuerza';s.progression.xp=777;
          s.reviews=[{date:'2026-08-29',weight:101.5,waist:99,pushups:12,plank:45,energy:7,pain:1,sleep:8,notes:'qa'}];
          s.sessionLogs=[{id:'qa-1',date:'2026-08-29',week:1,day:1,sessionId:'x',sessionName:'QA',start:'10:00',end:'11:00',duration:60,painBefore:0,painAfter:1,energyBefore:6,energyAfter:7,rpe:6,completion:1,planned:['A'],completed:['A'],omitted:[],skipReason:'',notes:'',decision:'maintain',substitutions:[],exerciseIds:['push_wall'],guided:true}];
          const payload=FORGE_STORE.exportPayload(s),restored=FORGE_STORE.importPayload(JSON.parse(JSON.stringify(payload)));
          if(restored.profile.name!=='QA Operator'||restored.profile.objective!=='Ganar fuerza'||restored.progression.xp!==777||restored.sessionLogs.length!==1||restored.sessionLogs[0].duration!==60||!restored.ui.onboardingComplete) throw Error('backup roundtrip mismatch');
          for(const bad of [{foo:'bar'},{product:'OTHER',data:{}},{product:'FORGE ASCENT'},{product:'FORGE ASCENT',data:[]}]){let ok=false;try{FORGE_STORE.importPayload(bad)}catch{ok=true}if(!ok)throw Error('invalid backup accepted')}
          const legacy=FORGE_STORE.importPayload({profile:{name:'Legacy'},progression:{xp:25}});if(legacy.profile.name!=='Legacy'||legacy.progression.xp!==25)throw Error('legacy backup rejected');
          const capped=FORGE_STORE.importPayload({sessionLogs:[{date:'2026-08-29',duration:999,week:1,day:1}]});if(capped.sessionLogs[0].duration!==1)throw Error('invalid imported duration not normalized safely');
          console.log('backup roundtrip/rejection PASS');
          JS

      - name: Progression invariant audit
        run: |
          node <<'JS'
          global.window=global;global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');vm.runInThisContext(fs.readFileSync('www/data-store.js','utf8'));
          const s=JSON.parse(JSON.stringify(FORGE_STORE.defaults));
          s.progression.xp=1250;s.progression.sessions=0;s.sessionLogs=[1,2,3].map((_,i)=>({date:`2026-08-${String(20+i).padStart(2,'0')}`,week:1,day:i+1,duration:45,rpe:6,painBefore:0,painAfter:0,energyBefore:5,energyAfter:6,completion:1}));
          const n=FORGE_STORE.normalize(s);if(n.progression.sessions<3||n.progression.xp!==1250)throw Error('progression invariant failed');
          console.log('progression invariant PASS');
          JS

      - name: Audit all 120 planned sessions
        run: |
          node <<'JS'
          global.window=global;global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');for(const f of ['data-store.js','training-data.js','adaptive-engine.js'])vm.runInThisContext(fs.readFileSync('www/'+f,'utf8'),{filename:f});
          const lib=JSON.parse(fs.readFileSync('www/exercise-library.json','utf8')),all=()=>lib.exercises;
          window.FORGE_EXERCISES={byId:id=>all().find(e=>e.id===id)||null,byPattern:p=>all().filter(e=>e.pattern===p),riskAllowed:(e,c={})=>{const p=+c.lumbarPain||0;if(p>=5&&e.lumbarStress>1)return false;if(p>=3&&e.lumbarStress>2)return false;return true},equipmentMatches:(e,user=[])=>{if(!e.equipment?.length)return true;const q=user.map(x=>String(x).toLowerCase());return e.equipment.every(r=>['silla','superficie_elevada','toalla','apoyo_estable'].includes(r)||(r==='caminadora'&&q.some(x=>x.includes('caminadora')))||(r==='banda'&&q.some(x=>x.includes('banda')))||(r==='mancuerna'&&q.some(x=>x.includes('mancuerna'))))},select(pattern,c={}){return this.byPattern(pattern).filter(e=>this.equipmentMatches(e,c.equipment||[])).filter(e=>this.riskAllowed(e,c))[0]||null}};
          const state=JSON.parse(JSON.stringify(FORGE_STORE.defaults));let tested=0;for(let w=1;w<=24;w++)for(let d=0;d<5;d++){const s=FORGE_ADAPTIVE.buildSession(d,w,state,FORGE_TRAINING),lines=s.items.filter(x=>!x.startsWith('Semana de descarga')&&!x.startsWith('Circuito ·'));tested++;if(!s.exerciseIds.length||lines.length!==s.exerciseIds.length)throw Error(`session audit failed w${w}d${d+1}`)}if(tested!==120)throw Error('session count mismatch');console.log('120/120 sessions PASS');
          JS

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Harden Gradle wrapper timeout
        run: |
          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=60000' >> android/gradle/wrapper/gradle-wrapper.properties
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 27/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.7"/' android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android
      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify patched assets copied into Android
        run: |
          grep -q "Unrecognized legacy backup" android/app/src/main/assets/public/data-store.js
          grep -q "localDateISO" android/app/src/main/assets/public/app.js
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0.7-native.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0.7_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0.7-native.apk
          if-no-files-found: error
          retention-days: 30
