name: Build FORGE ASCENT v2.0.9 AUDIT

on:
  pull_request:
    branches: ["forge-ascent-v206-ci-base"]
    paths:
      - "apps/forge-ascent/**"
      - ".github/workflows/build-forge-ascent-v209.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-ascent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-ascent/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore verified web bundle
        run: |
          rm -rf www bundle-v2.b64 bundle-v2.zip
          cat payload-v2/p01.b64 payload-v2/q02.b64 payload-v2/q03.b64 payload-v2/q04.b64 payload-v2/t05_1.b64 payload-v2/t05_2.b64 payload-v2/t05_3.b64 payload-v2/t05_4.b64 payload-v2/s06a.b64 payload-v2/s06b.b64 payload-v2/s07a.b64 payload-v2/s07b.b64 > bundle-v2.b64
          base64 --decode bundle-v2.b64 > bundle-v2.zip
          echo "b04029b6579866ac171f50a6765d30019d576f5a1c88ccaf89ad2eea49bf40ab  bundle-v2.zip" | sha256sum -c -
          unzip -t bundle-v2.zip
          mkdir -p www && unzip -q bundle-v2.zip -d www
      - name: Apply v2.0.9 audit patch
        run: python3 audit_v209.py
      - name: Syntax audit
        run: |
          node --check www/app.js
          node --check www/data-store.js
          node --check www/exercise-library.js
          node --check www/adaptive-engine.js
          node --check www/training-data.js
      - name: Mission credit and backup reconstruction audit
        run: |
          node <<'JS'
          global.window=global;let mem={};global.localStorage={getItem:k=>mem[k]||null,setItem:(k,v)=>mem[k]=v};
          const fs=require('fs'),vm=require('vm');vm.runInThisContext(fs.readFileSync('www/data-store.js','utf8'));
          const n=FORGE_STORE.importPayload({sessionLogs:[
            {date:'2026-08-29',week:1,day:1,duration:40,completion:.69},
            {date:'2026-08-29',week:1,day:2,duration:40,completion:.70},
            {date:'2026-08-29',week:1,day:3,duration:40,completion:1}
          ]});
          const days=n.progression.weekProgress['1']||[];
          if(days.includes(0)||!days.includes(1)||!days.includes(2)||days.length!==2) throw Error('mission-credit reconstruction failed');
          console.log('mission credit threshold PASS');
          JS
      - name: Zero-equipment and difficulty audit across 120 sessions
        run: |
          node <<'JS'
          global.window=global;global.localStorage={getItem:()=>null,setItem:()=>{}};
          const fs=require('fs'),vm=require('vm');
          for(const f of ['data-store.js','training-data.js','exercise-library.js','adaptive-engine.js'])vm.runInThisContext(fs.readFileSync('www/'+f,'utf8'),{filename:f});
          const lib=JSON.parse(fs.readFileSync('www/exercise-library.json','utf8'));
          window.FORGE_EXERCISES={
            byId:id=>lib.exercises.find(e=>e.id===id)||null,
            byPattern:p=>lib.exercises.filter(e=>e.pattern===p),
            equipmentMatches:(e,user=[])=>{if(!e.equipment?.length)return true;const q=user.map(x=>String(x).toLowerCase());return e.equipment.every(r=>['silla','superficie_elevada','toalla','apoyo_estable'].includes(r)||(r==='caminadora'&&q.some(x=>x.includes('caminadora')))||(r==='banda'&&q.some(x=>x.includes('banda')))||(r==='mancuerna'&&q.some(x=>x.includes('mancuerna')))},
            riskAllowed:(e,c={})=>{const p=+c.lumbarPain||0;if(p>=5&&e.lumbarStress>1)return false;if(p>=3&&e.lumbarStress>2)return false;return true},
            difficultyAllowed:(e,c={})=>{const l=+c.level||1,max=l<=1?3:l<=3?5:10;return e.difficulty<=max},
            select(pattern,c={}){return this.byPattern(pattern).filter(e=>this.equipmentMatches(e,c.equipment||[])).filter(e=>this.riskAllowed(e,c)).filter(e=>this.difficultyAllowed(e,c))[0]||null}
          };
          const state=JSON.parse(JSON.stringify(FORGE_STORE.defaults));state.profile.equipment=[];state.progression.xp=0;
          let n=0;
          for(let w=1;w<=24;w++)for(let d=0;d<5;d++){
            const s=FORGE_ADAPTIVE.buildSession(d,w,state,FORGE_TRAINING);n++;
            const blocked=(s.substitutions||[]).filter(x=>x.blocked);
            if(blocked.length)throw Error(`zero-equipment blocked slot w${w}d${d+1}: ${blocked.map(x=>x.pattern)}`);
            if(s.exerciseIds.some(id=>(FORGE_EXERCISES.byId(id)?.difficulty||0)>3))throw Error(`difficulty exceeded level-1 cap w${w}d${d+1}`);
            if(s.exerciseIds.length!==s.items.filter(x=>!x.startsWith('Semana de descarga')&&!x.startsWith('Circuito ·')).length)throw Error(`mapping fail w${w}d${d+1}`);
          }
          if(n!==120)throw Error('session count mismatch');
          if(!lib.exercises.some(e=>e.id==='march_in_place'&&!e.equipment.length))throw Error('equipment-free cardio missing');
          console.log('120/120 zero-equipment sessions PASS');
          JS
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Harden Gradle wrapper timeout
        run: |
          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=60000' >> android/gradle/wrapper/gradle-wrapper.properties
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 29/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.9"/' android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android
      - name: Build native debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify patched Android assets
        run: |
          grep -q 'completion>=.70' android/app/src/main/assets/public/app.js
          grep -q 'march_in_place' android/app/src/main/assets/public/training-data.js
          grep -q 'difficultyAllowed' android/app/src/main/assets/public/exercise-library.js
          test -f android/app/src/main/assets/public/assets/exercises/march_in_place.svg
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FORGE_ASCENT_v2.0.9-native.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE_ASCENT_v2.0.9_NATIVE_APK
          path: apps/forge-ascent/FORGE_ASCENT_v2.0.9-native.apk
          if-no-files-found: error
          retention-days: 30
